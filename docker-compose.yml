# yamllint disable rule:line-length
# yamllint disable rule:truthy
---
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared Redis for velocity counters (engine-policy-risk) and the
  # address-risk cache (kyt-aml-screening).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot DB reset: truncates every service database after postgres is
  # healthy and before any app service starts, so app boots land on empty
  # tables and never hold locks that would stall the truncate. The DB list
  # is derived from fixtures/seed/*.sql filenames (each seed file is named
  # <db>.sql), so adding a service DB only needs a new seed file.
  #
  # reset.sql is the same file used by `make reset-db`; it runs once per DB
  # with a 5s lock_timeout and a lock_not_available EXCEPTION handler so a
  # locked DB aborts atomically (left untouched, not half-truncated) and
  # the one-shot exits non-zero, which blocks downstream app services from
  # starting against a half-reset state.
  db-reset:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      - PGPASSWORD=postgres
    volumes:
      - ./fixtures:/fixtures:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /fixtures/seed/*.sql; do
          db=$$(basename "$$f" .sql)
          echo "Resetting database $$db..."
          psql -h postgres -U postgres -d "$$db" -v ON_ERROR_STOP=1 < /fixtures/reset.sql
        done
        echo "All databases reset."

  # Shared Kafka broker for the transactional event bus, audit-logger
  # ingestion, kyt-aml-screening audit sink, gateway-blockchain lifecycle
  # events, gateway-exchange fill/balance events, and treasury-
  # orchestration tx.completed consumption. Runs in KRaft combined mode
  # (no Zookeeper) with auto-topic creation enabled.
  kafka:
    image: apache/kafka:latest
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_RETENTION_MS=86400000
      - KAFKA_LOG_RETENTION_HOURS=24
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 15

  # One-shot init container that pre-creates Kafka topics which consumers
  #/producers expect to exist. Kafka auto-creates topics on consumer fetch
  # but NOT on producer metadata requests — the notification.dlq topic is
  # only produced to, so it must be pre-created or the KafkaJS producer
  # connect fails with "This server does not host this topic-partition".
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pre-creating Kafka topics..."
        for t in \
          audit.v1 \
          notification.v1 \
          notification.dlq \
          blockchain.events.v1 \
          ledger.events.v1 \
          liquidity.fills \
          fraud.scored \
          payment.events.v1 \
          rail.events.v1 \
          exchange.events.v1 \
          custody.events.v1 \
          transactions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$t \
            --partitions 1 --replication-factor 1 || true
        done
        echo "Kafka topics ready."

  # kyt-aml-screening auto-applies migrations on startup via store.Open.
  kyt-aml-screening:
    build: ../kyt-aml-screening
    ports:
      - "8081:8080"
    expose:
      - "9090"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/aml_kyt?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - DEV_MODE=1
      - CHAINALYSIS_WEBHOOK_SECRET=dev-secret-chainalysis
      - TRM_WEBHOOK_SECRET=dev-secret-trm
      - AUDIT_EVENT_BUS_URL=kafka://kafka:9092?topic=audit.v1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway-api:
    build: ../gateway-api
    ports:
      - "8080:8080"
    networks:
      - default

  audit-logger:
    build: ../audit-logger
    ports:
      - "8082:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/audit?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=audit.v1
      - PAYLOAD_BUCKET=
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # gateway-blockchain persists broadcasts, confirmations, fees, reorgs, and
  # outbox events to Postgres (DB_URL). Without CHAINS_SUPPORTED it boots with
  # a stub chain adapter — set it plus RPC_URLS_<CHAIN> env overrides to
  # point at a real node.
  gateway-blockchain:
    build: ../gateway-blockchain
    ports:
      - "8083:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/blockchain_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - WALLET_MGMT_URL=http://wallet-manager:8080
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
      - EVENT_BUS_URL=kafka://kafka:9092?topic=blockchain.events.v1
      - CHAINS_SUPPORTED=${CHAINS_SUPPORTED:-}
      - RPC_URLS_ETHEREUM=${RPC_URLS_ETHEREUM:-}
      - FINALITY_BLOCKS_ETHEREUM=${FINALITY_BLOCKS_ETHEREUM:-64}
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      wallet-manager:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway-exchange:
    build: ../gateway-exchange
    ports:
      - "8084:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/exchange_connectors?sslmode=disable
      - DUMMY_PRICE=65000
      - EVENT_BUS_URL=kafka://kafka:9092?topic=recon
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  engine-fraud:
    build: ../engine-fraud
    ports:
      - "8085:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/fraud?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fx-hedger:
    build: ../fx-hedger
    ports:
      - "8086:8080"
    networks:
      - default
    environment:
      - DUMMY_FX_RATE=1.10
      - DB_URL=postgres://postgres:postgres@postgres:5432/fx_hedging?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  gateway-auth:
    build: ../gateway-auth
    ports:
      - "8087:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/identity_auth?sslmode=disable
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully

  accounting-ledger:
    build: ../accounting-ledger
    ports:
      - "8088:8080"
    expose:
      - "8081"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/ledger_accounting?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
      # Shared HS256 secret for service-token JWT auth on internal REST
      # endpoints. Override in real deployments via a secrets mount.
      - SERVICE_TOKEN_SECRET=dev-internal-shared-secret
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  engine-liquidity:
    build: ../engine-liquidity
    ports:
      - "8089:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/liquidity?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - EXCHANGE_CONNECTORS_TARGET=gateway-exchange:9090
      - EVENT_BUS_URL=kafka://kafka:9092?topic=liquidity.fills
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # CUSTODY_PROVIDER=in_house runs the threshold engine as a single-process
  # t-of-n cluster (default t=2,n=3); DKG, rotation, and key metadata work
  # standalone. SignTx fails closed until POLICY_ENGINE_PUBKEY is configured
  # (the policy engine does not mint decision tokens yet). gRPC is served
  # with mTLS when /certs is populated (TLS_CERT_FILE/KEY/CA); otherwise it
  # falls back to plaintext inside the network when DEV_MODE=1.
  # Operator must provision /certs via a secrets mount or
  # `mpc-signer/scripts/gen-certs.sh`; the compose file does not
  # generate certs. Uncomment the TLS_* env vars and the volume mount to
  # enable mTLS.
  # For the full 3-node mTLS cluster see the service repo's
  # docker-compose.cluster.yml.
  mpc-signer:
    build: ../mpc-signer
    ports:
      - "8091:8080"
    expose:
      - "9090"
    networks:
      - default
    environment:
      - CUSTODY_PROVIDER=in_house
      - THRESHOLD_T=2
      - TOTAL_N=3
      - WALLET_MANAGEMENT_URL=http://wallet-manager:9090
      - KAFKA_BROKERS=kafka:9092
      - NODE_ID=node-0
      - DEV_MODE=1
      # mTLS for the gRPC port. The /certs mount is read-only; provision the
      # CA + server cert/key out-of-band (e.g. scripts/gen-certs.sh or a
      # secrets mount). When all three are unset, DEV_MODE=1 allows
      # plaintext; in prod the service refuses to start without them.
      # - TLS_CERT_FILE=/certs/mpc-signer.crt
      # - TLS_KEY_FILE=/certs/mpc-signer.key
      # - TLS_CA_FILE=/certs/internal-ca.crt
    # volumes:
    #   - internal-certs:/certs:ro
    depends_on:
      kafka:
        condition: service_healthy

  notifier:
    build: ../notifier
    ports:
      - "8092:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/notification?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  kyc-onboarding:
    build: ../kyc-onboarding
    ports:
      - "8093:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/onboarding_kyc?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  orchestrator-fiat:
    build: ../orchestrator-fiat
    ports:
      - "8094:8080"
    networks:
      - default
    environment:
      - WEBHOOK_SECRET=dev-secret
      - RAIL_CONNECTORS_URL=http://gateway-fiat:8080
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
      # Shared HS256 secret for service-token JWT auth on internal REST
      # endpoints. Override in real deployments via a secrets mount.
      - SERVICE_TOKEN_SECRET=dev-internal-shared-secret
    depends_on:
      kafka:
        condition: service_healthy

  engine-policy-risk:
    build: ../engine-policy-risk
    ports:
      - "8095:8080"
    expose:
      - "9090"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/policy_engine?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - POLICIES_DIR=/policies
      - MIGRATIONS_DIR=/migrations
      - PORT=8080
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  engine-pricing:
    build: ../engine-pricing
    ports:
      - "8096:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/pricing_quote?sslmode=disable
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/pricing_quote?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  gateway-fiat:
    build: ../gateway-fiat
    ports:
      - "8097:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/rail_connectors?sslmode=disable
      - WEBHOOK_SECRET=dev-secret
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully

  engine-recon:
    build: ../engine-recon
    ports:
      - "8098:8080"
    networks:
      - default
    environment:
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/reconciliation
      - KAFKA_BROKERS=kafka:9092
      - ENABLE_KAFKA=true
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  orchestrator-tx:
    build: ../orchestrator-tx
    ports:
      - "8099:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/transaction_orchestrator?sslmode=disable
      - EVENT_BUS_URL=kafka://kafka:9092?topic=transactions
      - POLICY_URL=engine-policy-risk:9090
      - KYT_URL=kyt-aml-screening:9090
      - MPC_URL=mpc-signer:9090
      - LEDGER_URL=accounting-ledger:8081
      - PAYMENT_URL=http://orchestrator-fiat:8080
      - BLOCKCHAIN_URL=http://gateway-blockchain:8080
      - ENABLE_STUB_PARTNERS=1
      - DEV_MODE=1
      # Shared HS256 secret for service-token JWT auth on internal REST
      # endpoints. Override in real deployments via a secrets mount.
      - SERVICE_TOKEN_SECRET=dev-internal-shared-secret
      # mTLS material for the txo→partner gRPC dials. When all three are
      # unset, the dials fall back to plaintext (allowed only with DEV_MODE=1
      # or ENABLE_STUB_PARTNERS=1). Uncomment and mount /certs to enable.
      # - TLS_CERT_FILE=/certs/orchestrator-tx.crt
      # - TLS_KEY_FILE=/certs/orchestrator-tx.key
      # - TLS_CA_FILE=/certs/internal-ca.crt
    # volumes:
    #   - internal-certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      engine-policy-risk:
        condition: service_started
      kyt-aml-screening:
        condition: service_started
      mpc-signer:
        condition: service_started
      accounting-ledger:
        condition: service_started
      orchestrator-fiat:
        condition: service_started
      gateway-blockchain:
        condition: service_started

  orchestrator-treasury:
    build: ../orchestrator-treasury
    ports:
      - "8100:8080"
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/treasury?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - LIQUIDITY_ROUTING_URL=http://engine-liquidity:8080
      - FX_HEDGING_URL=http://fx-hedger:8080
      - WALLET_MGMT_URL=http://wallet-manager:8080
      - EVENT_BUS_URL=kafka://kafka:9092?topic=transactions
      - TX_ORCH_EVENT_TOPIC=transactions
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Migrations are applied automatically at startup; the wallet_management
  # database itself must exist (see postgres-init.sql).
  # The XPUB values are dev-only public derivation keys (same vectors as its
  # test suite); production loads them from a secrets store.
  wallet-manager:
    build: ../wallet-manager
    ports:
      - "8101:8080"  # REST; gRPC (ResolveKeyID, gateway callbacks) is on wallet-manager:9090 inside the network
    networks:
      - default
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/wallet_management?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - TREASURY_ORCHESTRATION_URL=http://orchestrator-treasury:8080
      - POLICY_RISK_ENGINE_URL=http://engine-policy-risk:8080
      - KAFKA_BROKERS=kafka:9092
      - DEV_MODE=1
      - EVM_XPUB=xpub6CeDpm2b5qtk96oy8yvM572W6cLZSvU5vnpKmKPypbfFwXo86SyT7VtfwWtMZAgZ5eKVMU9NnULt91HBFw9j62wJrcoc1ZRWiNvoorwBRXL
      - BTC_XPUB=xpub6C1HVMz946r433QEjZGpYYWYcspxXXBPys5PBGkmQboRXE6RLfFiStEkKbWKCZaPgDrzZh9nUEunxuiuy6MNdw23du2Ek7GoKYMJVH8eK5E
      - SOL_XPUB=11111111111111111111111111111111
    depends_on:
      postgres:
        condition: service_healthy
      db-reset:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── UIs — customer-facing and internal consoles ──
  # ui-front-office: Next.js (standalone) on :3000; customer-facing app,
  # talks to the stack through the API Gateway BFF.
  ui-front-office:
    build:
      context: ../ui-front-office
    ports:
      - "8102:3000"
    networks:
      - default
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_GATEWAY_URL=http://gateway-api:8080
      - NEXT_PUBLIC_APP_NAME=AI Crypto On-Ramp
      - NEXT_PUBLIC_AUTH_ISSUER=http://gateway-auth:8080
      - NEXT_PUBLIC_AUTH_CLIENT_ID=front-office
    depends_on:
      - gateway-api

  # ui-middle-office: Vite SPA served by nginx on :3000; internal
  # compliance/ops console, calls backend services directly via REST.
  ui-middle-office:
    build:
      context: ../ui-middle-office
    ports:
      - "8103:3000"
    networks:
      - default

  # ui-back-office: Streamlit treasury/finance console on :8501.
  # Talks to backend services directly via REST.
  ui-back-office:
    build:
      context: ../ui-back-office
    ports:
      - "8104:8501"
    networks:
      - default
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - TREASURY_URL=http://orchestrator-treasury:8080
      - LIQUIDITY_URL=http://engine-liquidity:8080
      - FX_HEDGING_URL=http://fx-hedger:8080
      - LEDGER_URL=http://accounting-ledger:8080
      - RECONCILIATION_URL=http://engine-recon:8080
      - WALLET_URL=http://wallet-manager:8080
      - PAYMENT_URL=http://orchestrator-fiat:8080
      - MPC_URL=http://mpc-signer:8080

  # ── Gatus — health dashboard, configured via gatus.yml ──
  gatus:
    image: twinproduction/gatus:latest
    ports:
      - "8090:8080"
    networks:
      - default
    volumes:
      - ./gatus.yml:/config/config.yaml:ro
      - gatus-data:/data/

volumes:
  gatus-data:
  pg-data:
  # Internal mTLS material (CA + per-service cert/key). Populate out-of-band
  # via a secrets mount or `mpc-signer/scripts/gen-certs.sh`; the
  # compose file does not generate certs. Mount read-only at /certs in the
  # services that opt into mTLS (mpc-signer, orchestrator-tx).
  internal-certs:
